addEventListener("hashchange",()=>{const n=Object.keys(H).find(k=>"#"+H[k]==location.hash);if(n)go(+n)});
function spy(){const t=[1,2,3].map(i=>$("#s"+i).getBoundingClientRect().top);let n=1;if(t[1]<=innerHeight*.45)n=2;if(t[2]<=innerHeight*.45)n=3;
if(n!=act){act=n;$$("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go==n));history.replaceState(null,"","#"+H[n])}}

/* Nota amarilla (abajo): 2 segundos o hasta tocar una categoría */
let tipT;function tip(on){const t=$("#tip");t.classList.toggle("on",on);clearTimeout(tipT);if(on)tipT=setTimeout(()=>t.classList.remove("on"),2400)}
new IntersectionObserver(([e])=>{inView=e.isIntersecting;if(inView&&!picked)tip(true);if(!inView)tip(false)},{threshold:.12}).observe($("#s2"));

/* Filtros */
const cats=$("#cats");
function buildCats(){cats.innerHTML="";["TODOS",...CATS].forEach(c=>{const b=document.createElement("button");b.className="cap";b.innerHTML=c+(c=="TODOS"?"":"<sup>"+P.filter(p=>p.c.includes(c)).length+"</sup>");b.setAttribute("aria-pressed",c==cur);
b.onclick=()=>{cur=c;picked=1;tip(false);$$(".cap").forEach(x=>x.setAttribute("aria-pressed",x==b));$("#track").classList.add("out");clearTimeout(window.ft);window.ft=setTimeout(render,RM?0:260)};cats.append(b)})}

/* Galería: columnas que encajan en el alto disponible (estilo Pinterest, scroll horizontal) */
function art(p){if(p.img)return `<div class="art"><img src="${p.img}" alt="${p.t}" loading="lazy" draggable="false">${p.v?'<span class="play" aria-hidden="true">VIDEO ▶</span>':""}</div>`;return `<div class="art" style="background:${p.bg};color:${p.fg}"><small>${(p.type||"").toUpperCase()}</small>${p.t}</div>`}
function render(){list=P.map((p,i)=>({...p,i})).filter(p=>cur=="TODOS"||p.c.includes(cur));
const tr=$("#track");tr.innerHTML="";tr.classList.remove("out");
if(!list.length){tr.innerHTML='<p class="empty">'+(loading?"":cur=="TODOS"?"Todavía no hay proyectos publicados.":"Sin proyectos en esta categoría.")+"</p>";max=0;tgt=pos=0;upd();return}
const gl=$("#gal"),gw=gl.clientWidth,Hh=Math.max(140,gl.clientHeight-2),gap=Math.max(14,innerWidth*.014),cap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cap"))||38,mob=innerWidth<=800;
tr.style.setProperty("--gap",gap+"px");
const cw=it=>(Hh-it.length*cap-(it.length-1)*gap)/it.reduce((s,p)=>s+1/p.r,0),tg=Hh*(mob?.6:.5),cols=[];
for(let k=0;k<list.length;){let b=1,bd=1e9;for(let n=1;n<=Math.min(3,list.length-k);n++){const w=cw(list.slice(k,k+n));if(w<=0)break;const d=Math.abs(Math.log(w/tg));if(d<bd){bd=d;b=n}}cols.push(list.slice(k,k+b));k+=b}
let k=0;
cols.forEach(it=>{const col=document.createElement("div");col.className="col";const colW=Math.min(cw(it),gw*.9);col.style.setProperty("--cw",colW+"px");
it.forEach(p=>{const n=k++,c=document.createElement("div");c.className="card enter"+(p.v?" v":"");c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-label",p.t+", "+p.type);c.style.setProperty("--r2",p.r);
c.innerHTML=`<div class="im">${art(p)}</div><div class="cp"><div class="l"><span>${String(n+1).padStart(2,"0")}</span><span class="tt">${p.t}</span><span class="vm" aria-hidden="true">${colW>=150?"VER MÁS ↗":"↗"}</span></div><div class="fi"><p><em>Tipo</em>${p.type}</p><p>${p.what}</p><p><em>Rol</em>${p.role}</p><p class="hint">Hacé clic para ver más →</p></div></div>`;
c.onclick=()=>{if(!moved)show(n)};c.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();show(n)}};
if(p.vurl){c.onmouseenter=()=>{if(innerWidth<=800||c.querySelector(".hv"))return;const v=document.createElement("video");v.src=p.vurl;v.muted=true;v.loop=true;v.playsInline=true;v.className="hv";c.querySelector(".im").append(v);v.play().catch(()=>{})};c.onmouseleave=()=>{const v=c.querySelector(".hv");if(v)v.remove()}}
col.append(c);setTimeout(()=>c.classList.remove("enter"),RM?0:60+n*60)});
tr.append(col)});
requestAnimationFrame(()=>{max=Math.max(0,tr.scrollWidth-gl.clientWidth);pos=tgt=0;dir=1;pause(0);upd()})}
let rz,lw=innerWidth,lh=innerHeight;
addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(innerWidth!=lw||Math.abs(innerHeight-lh)>120){lw=innerWidth;lh=innerHeight;render()}},180)});
const gal=$("#gal"),tr=$("#track");
function upd(){tr.style.transform=`translate3d(${-pos}px,0,0)`;const bw=$("#bar").clientWidth-34,f=max?pos/max:0;$("#thumb").style.left=(f*bw)+"px";$("#cnt").textContent=max?Math.round(f*100)+"%":"";$("#bar").setAttribute("aria-valuenow",Math.round(f*100))}
let lt=performance.now();
(function loop(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;
if(!RM&&inView&&cur=="TODOS"&&!hov&&!dragging&&!document.hidden&&open<0&&max>0&&now>pauseUntil){tgt=clamp(tgt+dir*26*dt);if(tgt>=max||tgt<=0){dir=-dir;pause(1600)}}
const d=tgt-pos;if(Math.abs(d)>.1){pos+=RM?d:d*.14;upd()}requestAnimationFrame(loop)})(lt);
gal.addEventListener("wheel",e=>{const h=Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey;if(!max||!h)return;e.preventDefault();tgt=clamp(tgt+(e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX));pause()},{passive:false});
tr.addEventListener("mouseover",e=>{hov=e.target.closest(".card")?1:0});gal.addEventListener("mouseleave",()=>{hov=0;pause(250)});
gal.addEventListener("pointerdown",e=>{dragging=1;moved=0;sx=lx=e.clientX;st=tgt;vel=0;pause(5000)});
addEventListener("pointermove",e=>{if(!dragging)return;const dx=e.clientX-sx;if(Math.abs(dx)>6){moved=1;gal.classList.add("drag")}if(moved){vel=e.clientX-lx;tgt=clamp(st-dx)}lx=e.clientX});
addEventListener("pointerup",()=>{if(dragging&&moved)tgt=clamp(tgt-vel*8);dragging=0;gal.classList.remove("drag");pause(1800);setTimeout(()=>moved=0,30)});
const step=()=>innerWidth*.35;
document.addEventListener("keydown",e=>{if(open>-1){if(e.key=="Escape")hide();if(e.key=="ArrowRight")nav(1);if(e.key=="ArrowLeft")nav(-1);return}
if(inView&&!e.target.closest("button,input")){if(e.key=="ArrowRight"){tgt=clamp(tgt+step());pause()}if(e.key=="ArrowLeft"){tgt=clamp(tgt-step());pause()}}});
const bar=$("#bar");let bd=0;const fromBar=e=>{const r=bar.getBoundingClientRect();tgt=Math.max(0,Math.min(1,(e.clientX-r.left-17)/(r.width-34)))*max;pause(5000)};
bar.addEventListener("pointerdown",e=>{bd=1;bar.setPointerCapture(e.pointerId);fromBar(e)});bar.addEventListener("pointermove",e=>{if(bd)fromBar(e)});bar.addEventListener("pointerup",()=>bd=0);

/* Visor emergente */
function embed(u){let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);if(m)return"https://www.youtube.com/embed/"+m[1];m=u.match(/vimeo\.com\/(\d+)/);return m?"https://player.vimeo.com/video/"+m[1]:""}
function mh(p,x){if(x.kind=="image")return`<img src="${esc(x.url)}" alt="${p.t}">`;if(x.kind=="video")return`<video src="${esc(x.url)}"${p.img?` poster="${p.img}"`:""} controls playsinline autoplay muted></video>`;const e=embed(x.url);return e?`<iframe src="${e}" allow="autoplay;fullscreen" allowfullscreen title="${p.t}"></iframe>`:""}
function show(k,m=0){open=k;const p=list[k],md=p.media,n=md?md.length:0;m=n?(m+n)%n:0;
$("#lbm").innerHTML=n?mh(p,md[m]):`<div style="position:relative;width:min(100%,calc(60dvh*${p.r}));aspect-ratio:${p.r}">${art(p)}</div>`;
$("#lbt").innerHTML=`<p class="mono" style="color:var(--mid);margin-bottom:16px">${String(k+1).padStart(2,"0")} / ${String(list.length).padStart(2,"0")}</p><h2>${p.t}</h2><dl><dt>TIPO DE PIEZA</dt><dd>${p.type}</dd><dt>QUÉ SE HIZO</dt><dd>${p.what}</dd><dt>ROL</dt><dd>${p.role}</dd><dt>CATEGORÍAS</dt><dd>${p.c.join(" · ")}</dd><dt>AÑO</dt><dd>${p.y}</dd></dl>${n>1?`<div class="mn"><button onclick="show(${k},${m-1})" aria-label="Anterior">←</button>${m+1} / ${n}<button onclick="show(${k},${m+1})" aria-label="Siguiente">→</button></div>`:""}`;
document.body.style.overflow="hidden";$("#lb").classList.add("on");$(".lbx").scrollTop=0;$("#cl2").focus()}
function hide(){$("#lb").classList.remove("on");open=-1;$("#lbm").innerHTML="";document.body.style.overflow="";pause(400)}
const nav=d=>show((open+d+list.length)%list.length);
$("#cl2").onclick=hide;$("#pv").onclick=()=>nav(-1);$("#nx").onclick=()=>nav(1);$("#lb").addEventListener("click",e=>{if(e.target.id=="lb")hide()});

addEventListener("scroll",()=>{if(!window._tk){window._tk=1;requestAnimationFrame(()=>{window._tk=0;spy()})}},{passive:true});

/* Datos reales (Supabase) */
const pub=p=>`${SU}/storage/v1/object/public/portfolio/${p}`;
const api=async q=>{const r=await fetch(`${SU}/rest/v1/${q}`,{headers:{apikey:SK,Authorization:"Bearer "+SK}});if(!r.ok)throw new Error(r.status);return r.json()};
function contacts(f){f=f||{};const m=f.email||DEF.email,rows=[["Instagram",DEF.insta,"https://instagram.com/"+DEF.insta.slice(1)],["Correo",m,"mailto:"+m]];
if(/^https?:/.test(f.linkedin||""))rows.push(["LinkedIn","Ver perfil",f.linkedin]);(f.links||[]).forEach(l=>/^https?:/.test(l.url)&&rows.push([l.label,"Abrir",l.url]));if(f.cv_path)rows.push(["CV","Descargar",pub(f.cv_path)]);
$("#cl").innerHTML=rows.map(r=>`<a class="d" href="${esc(r[2])}" target="_blank" rel="noopener"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></a>`).join("");
const wa=$("#wa");wa.href="https://wa.me/"+(f.whatsapp||DEF.whatsapp).replace(/\D/g,"");wa.target="_blank";wa.rel="noopener"}
function fillProfile(f){const ps=$$("#s3 section p");if(f){[f.bio,f.trajectory,f.skills].forEach((t,i)=>{if(t)ps[i].textContent=t});
if(f.photo_path)$(".ph").innerHTML=`<img src="${esc(pub(f.photo_path))}" alt="Kevin Cura" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`}contacts(f)}
/* Mide la proporción real de cada portada para que encaje sin recortes ni bordes */
function measure(p){return new Promise(r=>{if(!p.img)return r();const i=new Image();i.onload=()=>{if(i.naturalWidth&&i.naturalHeight)p.r=i.naturalWidth/i.naturalHeight;r()};i.onerror=()=>r();i.src=String(p.img).replace(/&amp;/g,"&")})}
function apply(d){const[cs,ps,pf]=d;CATS=cs.map(c=>esc(c.name));
P=ps.map(p=>{const md=(p.project_media||[]).sort((a,b)=>a.position-b.position).map(m=>({kind:m.kind,url:m.path?pub(m.path):m.url})),img=p.cover_path?esc(pub(p.cover_path)):null,v=md.find(m=>m.kind=="video");
return{t:esc(p.title),c:(p.project_categories||[]).map(x=>esc(x.categories.name)),r:+p.cover_ratio||1,bg:"#D9DDE1",fg:"#22272D",type:esc(p.work_type),what:esc(p.description),role:esc(p.role),y:p.year||"",v:md.some(m=>m.kind!="image"),vurl:v&&v.url,img,media:md.length?md:(img?[{kind:"image",url:img}]:null)}});
loading=false;document.documentElement.classList.remove("ld");fillProfile(pf[0]);buildCats();
Promise.race([Promise.all(P.map(measure)),new Promise(r=>setTimeout(r,2000))]).then(render)}
async function boot(){if(!loading){buildCats();render();contacts(null);return}
try{const c=localStorage.getItem("pf");if(c)apply(JSON.parse(c))}catch(e){}
try{const d=await Promise.all([api("categories?select=name&order=position"),api("projects?select=title,description,work_type,role,year,cover_path,cover_ratio,project_media(kind,path,url,position),project_categories(categories(name))&published=eq.true&order=position"),api("profile?id=eq.1&select=*")]);
try{localStorage.setItem("pf",JSON.stringify(d))}catch(e){}apply(d)}catch(e){console.error(e);loading=false;document.documentElement.classList.remove("ld");contacts(null);buildCats();render()}}

/* Aparición de textos del perfil */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});$$(".rv").forEach(x=>io.observe(x));

boot().then(()=>{const n=Object.keys(H).find(k=>"#"+H[k]==location.hash);if(n&&n!=1)setTimeout(()=>go(+n,false),50);spy()});
</script></body></html>
